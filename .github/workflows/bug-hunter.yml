name: bug-hunter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  bug-hunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Run BHS on self (local sandbox mode)
        env:
          BHS_SANDBOX_MODE: local
        run: |
          python -m bhs.cli --repo .
