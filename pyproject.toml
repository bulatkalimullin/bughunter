[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter-swarm"
version = "0.1.0"
description = "BugHunter Swarm — hierarchical multi-agent DAG for autonomous bug hunting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BugHunter Swarm Maintainers" }]
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "docker>=7.0",
    "minio>=7.2",
    "redis>=5.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
bhs-run = "bhs.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/bughunter-swarm"
Repository = "https://github.com/OWNER/bughunter-swarm"
Documentation = "https://github.com/OWNER/bughunter-swarm#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bhs = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
